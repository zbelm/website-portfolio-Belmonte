<!doctype html>
<!--
  Source for public/og-image.png (1200×630 social preview).
  Regenerate after editing (Windows, from the project folder):
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot="%CD%\public\og-image.png" "%CD%\scripts\og-image.html"
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Press Start 2P'; src: url('../public/fonts/press-start-2p-latin.woff2'); }
      @font-face { font-family: 'VT323'; src: url('../public/fonts/vt323-latin.woff2'); }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: linear-gradient(#08011a, #250a52 60%, #5b1a7d);
        color: #f4efff;
        font-family: 'VT323', monospace;
      }
      .stars { position: absolute; inset: 0; background-image:
        radial-gradient(#fff 1.5px, transparent 2px), radial-gradient(#ffe45c 1.5px, transparent 2px);
        background-size: 97px 83px, 151px 127px; background-position: 10px 20px, 60px 40px; opacity: .7; }
      .city { position: absolute; left: 0; right: 0; bottom: 70px; height: 150px;
        background: repeating-linear-gradient(90deg, #170838 0 90px, transparent 90px 98px, #170838 98px 150px, transparent 150px 160px);
        clip-path: polygon(0 40%, 8% 40%, 8% 10%, 16% 10%, 16% 55%, 25% 55%, 25% 0, 33% 0, 33% 45%, 45% 45%, 45% 20%, 55% 20%, 55% 60%, 66% 60%, 66% 5%, 75% 5%, 75% 35%, 86% 35%, 86% 15%, 94% 15%, 94% 50%, 100% 50%, 100% 100%, 0 100%); }
      .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #1a0838; border-top: 8px solid #ff7ccb; }
      .card { position: absolute; left: 70px; top: 70px; width: 760px; padding: 40px 44px; background: #1d0b42;
        box-shadow: 0 -6px 0 #b69cff, 0 6px 0 #b69cff, -6px 0 0 #b69cff, 6px 0 0 #b69cff, 14px 14px 0 6px #000; }
      .kicker { font-family: 'Press Start 2P'; font-size: 18px; color: #3be8ff; margin: 0 0 22px; }
      h1 { font-family: 'Press Start 2P'; font-weight: 400; font-size: 46px; line-height: 1.35; margin: 0 0 20px; text-shadow: 5px 5px 0 #ff2d95; }
      h1 span { color: #ffe45c; }
      p { font-size: 38px; margin: 0 0 10px; line-height: 1.2; }
      .status { display: inline-block; margin-top: 14px; font-family: 'Press Start 2P'; font-size: 16px; color: #12062b; background: #5dff9b; padding: 10px 14px; }
      .logo { position: absolute; right: 90px; top: 110px; width: 230px; height: 230px; display: grid; place-items: center;
        background: #ffe45c; color: #12062b; font-family: 'Press Start 2P'; font-size: 84px; box-shadow: 0 0 0 10px #12062b, 18px 18px 0 10px #ff2d95; }
    </style>
  </head>
  <body>
    <div class="stars"></div>
    <div class="city"></div>
    <div class="ground"></div>
    <div class="card">
      <p class="kicker">▶ PLAYER ONE PORTFOLIO</p>
      <h1>Francis Zachary <span>Belmonte</span></h1>
      <p>App · Web · Game Developer · Content Creator</p>
      <p>BSIT-MWA @ National University – MOA</p>
      <span class="status">● OPEN TO OJT / INTERNSHIPS</span>
    </div>
    <div class="logo">P1</div>
  </body>
</html>
