<!doctype html>
<html lang="en" data-theme="dark" data-crt="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Values in {{ }} are injected from src/config/site.js at build time -->
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="author" content="{{NAME}}" />
    <link rel="canonical" href="{{URL}}/" />
    <meta name="theme-color" content="#0d0221" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eaf6ff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- pixel fonts load in parallel with the JS, so text doesn't re-flow (no layout shift) -->
    <link rel="preload" href="/fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{NAME}} — Player One Portfolio" />
    <meta property="og:locale" content="{{LOCALE}}" />
    <meta property="og:url" content="{{URL}}/" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <script type="application/ld+json">{{JSON_LD}}</script>

    <!-- Apply saved theme / CRT setting before first paint (no flash) -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('p1-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          d.dataset.theme = t;
          d.dataset.crt = localStorage.getItem('p1-crt') === 'off' ? 'off' : 'on';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: monospace; padding: 24px; max-width: 720px; margin: auto; line-height: 1.6">
        <h1>{{NAME}}</h1>
        <p>{{DESCRIPTION}}</p>
        <p><a href="/resume.pdf">Download resume (PDF)</a> · <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
        <p>Enable JavaScript to play the full "Player One" portfolio.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
